<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Homemade+Apple&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 960px;
      height: 1248px;
      background: #d0ccc4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: 864px;
      height: 1152px;
      transform: perspective(1200px) rotateY(-3deg) rotateX(2deg);
      filter: drop-shadow(24px 30px 40px rgba(0,0,0,0.45)) drop-shadow(8px 10px 18px rgba(0,0,0,0.28));
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E"),
        linear-gradient(175deg, #fcf8f0 0%, #efe6d6 55%, #e4d9c8 100%);
      overflow: hidden;
      box-shadow: inset 0 0 80px rgba(100,80,50,0.1), inset -10px 0 28px rgba(0,0,0,0.05);
    }

    .lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(180deg, transparent 0 30px, rgba(100,155,215,0.58) 30px 31px);
      background-position: 0 58px;
    }

    .margin-red {
      position: absolute;
      left: 50px;
      top: 0;
      width: 2px;
      height: 100%;
      background: #d07070;
    }

    .ghost {
      position: absolute;
      top: 4px;
      left: 6px;
      font: 20px 'Homemade Apple', cursive;
      color: rgba(28,82,168,0.2);
      transform: rotate(-8deg) scaleY(-1);
    }

    .zed {
      position: absolute;
      top: 22px;
      left: 18px;
      font: 700 42px 'Arial Black', sans-serif;
      color: rgba(255,255,255,0.92);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
      letter-spacing: 0.05em;
    }

    .content { padding: 48px 40px 90px 62px; position: relative; z-index: 2; }

    /* Prescott-style: white outline + stacked shadow = extruded 3D ink */
    .ink-3d {
      font-family: 'Homemade Apple', 'Caveat', cursive;
      color: #1a4fa8;
      -webkit-text-stroke: 2px rgba(255,255,255,0.82);
      paint-order: stroke fill;
      text-shadow:
        0 1px 0 #0a2868,
        1px 2px 0 #0b2d72,
        2px 3px 0 #0c327c,
        3px 4px 0 #0d3786,
        4px 5px 0 #0e3c90,
        5px 6px 0 #0f419a,
        6px 7px 1px rgba(5,20,60,0.65),
        7px 9px 3px rgba(5,20,60,0.45),
        8px 12px 10px rgba(26,79,168,0.4),
        10px 16px 24px rgba(0,0,0,0.18);
    }

    .title {
      font-size: 118px;
      text-align: center;
      margin: 30px 0 10px -6px;
      transform: rotate(-2.5deg);
      line-height: 0.9;
    }

    .recipe { font-size: 36px; line-height: 1.45; }

    .line { display: block; white-space: nowrap; }
    .l1 { transform: translate(8px, 6px) rotate(-1deg); }
    .l2 { transform: translate(28px, 12px) rotate(0.5deg); font-size: 34px; }
    .l3 { transform: translate(4px, 18px) rotate(-0.3deg); }
    .l4 { transform: translate(16px, 24px) rotate(0.7deg); font-size: 33px; }
    .l5 { transform: translate(10px, 30px) rotate(-0.4deg); }
    .l6 { transform: translate(2px, 36px) rotate(0.2deg); font-size: 34px; }

    .arc {
      display: inline-block;
      width: 52px;
      height: 18px;
      border-bottom: 3px solid #1a4fa8;
      border-radius: 0 0 80% 90%;
      transform: translate(0, -8px) rotate(-6deg);
      filter: drop-shadow(2px 3px 2px rgba(26,79,168,0.35));
    }

    .by-wrap {
      position: absolute;
      right: 44px;
      bottom: 52px;
    }

    .by {
      font: 900 38px 'Arial Black', sans-serif;
      color: #000;
      -webkit-text-stroke: 1px rgba(255,255,255,0.7);
      text-shadow:
        0 1px 0 #333, 1px 2px 0 #222, 2px 3px 0 #111,
        3px 4px 0 #000, 4px 5px 2px rgba(0,0,0,0.5),
        6px 10px 16px rgba(0,0,0,0.28);
      letter-spacing: 0.05em;
    }

    .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.35) 0%, transparent 30%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="lines"></div>
      <div class="margin-red"></div>
      <div class="ghost">butter m... creme ... brittle ...</div>
      <div class="zed">zed</div>
      <div class="shine"></div>
      <div class="content">
        <div class="title ink-3d">Fondant</div>
        <div class="recipe ink-3d">
          <span class="line l1">2 lb pkg powdered</span>
          <span class="line l2">butter (melted) <span class="arc"></span> 1 Can</span>
          <span class="line l3">condensed milk . 1 lb</span>
          <span class="line l4">about 1/2 large pkg. coconut</span>
          <span class="line l5">1 12 oz pkg Chocol</span>
          <span class="line l6">1 Cake of paraffin - (wax</span>
        </div>
      </div>
      <div class="by-wrap"><div class="by">by Christy C.</div></div>
    </div>
  </div>
</body>
</html>
